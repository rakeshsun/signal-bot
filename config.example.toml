# Copy to config.toml and edit. Broker secrets go in .env, not here.

# Days of history loaded at start-up (indicator warm-up).
history_days = 30

# Weekday "bot is running" message (Chicago time). -1 turns it off.
heartbeat_hhmm = 715

# Also read this week's CPI / jobs-report dates from the ForexFactory feed.
fetch_news_calendar = true

[notify]
# Free phone push: install "ntfy" (developer Philipp Heckel) and subscribe to this topic.
# Pick a hard-to-guess name - anyone who knows it can read your alerts.
ntfy_topic = ""
telegram_token = ""
telegram_chat_id = ""
macos_banner = true

# ─────────────────────────── Watches ───────────────────────────
# Each [[watch]] runs one strategy on one instrument. Add as many as you like.
# `signalbot strategies` lists the available strategies and their params.
# symbol: "auto" + product = active futures month; or "/GCZ6"; or a stock ticker like "SPY".

[[watch]]
name = "gold"
strategy = "metals_confluence"
# Which gold contract to watch:
#   "auto"   = the active (most traded) month; switches by itself at each roll
#   "/GCG27" = February 2027 (also /GCZ26 Dec 2026, /GCJ27 Apr 2027 ...). Month codes:
#              F Jan, G Feb, H Mar, J Apr, K May, M Jun, N Jul, Q Aug, U Sep, V Oct, X Nov, Z Dec
#   Use the full-size GC code even if you trade /MGC: the signal is the same, alerts show both.
symbol = "auto"
product = "GC"
interval = "15m"
enabled = true
news_alert = true                       # 7:00 CT heads-up on CPI / jobs days
contracts = { "/MGC" = 10, "/GC" = 100 } # $ per point, shown in alerts
point_value = 100                       # $ per point of the data symbol (backtest totals)

[watch.params]   # overrides; omit to use the tested defaults
atr_mult = 1.75
rr = 1.5
session_start = 720
session_end = 830     # 1-year test: before the 8:30 US open is clearly better
skip_bars = "745"     # signal bar right after 7:30 CT data releases: 1 win in 10 over the year

[[watch]]
name = "gold-asia"
strategy = "metals_confluence"
symbol = "auto"                         # or e.g. "/GCG27", same as the gold watch
product = "GC"
interval = "15m"
enabled = true
paper = true                            # alerts say PAPER: watch / paper trade only
contracts = { "/MGC" = 10, "/GC" = 100 }
point_value = 100

[watch.params]   # Asia session 6 PM - 2 AM CT (1-year test: 43% wins, PF 1.4, profitable both halves)
session_start = 1800
session_end = 200


[[watch]]
name = "es"
strategy = "es_range_breakout"
symbol = "auto"
product = "ES"
interval = "15m"
enabled = false                         # thin edge - turn on to paper trade it
contracts = { "/MES" = 5, "/ES" = 50 }
point_value = 50

[watch.params]
rr = 1.0

