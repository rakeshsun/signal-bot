[project]
name = "gold-signal-bot"
version = "0.1.0"
description = "Live alerts for the Metals Confluence gold futures strategy, using tastytrade market data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["tastytrade>=13.2,<14"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
goldbot = "goldbot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/goldbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
