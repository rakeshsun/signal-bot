[project]
name = "signal-bot"
version = "0.1.0"
description = "Pluggable trading-strategy signal bot: live tastytrade candles in, phone alerts out"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["tastytrade>=13.2,<14", "certifi"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
signalbot = "signalbot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signalbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
